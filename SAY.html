<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 스위치 - 10대를 위한 감정 명언</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --primary: #6c5ce7;
            --primary-hover: #5b4cc4;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #2d3436;
        }

        .subtitle {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 24px;
        }

        /* 감정 버튼 그리드 */
        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .emotion-btn {
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .emotion-btn:active {
            transform: scale(0.96);
        }

        /* 감정별 색상 지정 */
        .btn-happy { background-color: #fff3cd; color: #856404; }
        .btn-sad { background-color: #d1ecf1; color: #0c5460; }
        .btn-burnout { background-color: #e2e3e5; color: #383d41; }
        .btn-stress { background-color: #f8d7da; color: #721c24; }
        .btn-excitement { background-color: #d4edda; color: #155724; }
        .btn-joy { background-color: #ffeeba; color: #856404; }
        .btn-anger { background-color: #f5c6cb; color: #491217; }

        /* 결과 카드 영역 */
        .card-view {
            display: none;
            background: #fdfbf7;
            border: 2px dashed #e0d6c3;
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            position: relative;
        }

        .quote-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .quote-author {
            font-size: 14px;
            color: #b2bec3;
            margin-bottom: 20px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .sub-btn {
            padding: 10px 16px;
            font-size: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-retry {
            background-color: var(--primary);
            color: white;
        }

        .btn-back {
            background-color: #dfe6e9;
            color: #2d3436;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>마음 스위치 💡</h1>
        <p class="subtitle">오늘, 당신의 마음은 어떤 모양인가요?</p>

        <!-- 감정 선택 버튼들 -->
        <div class="emotion-grid" id="emotionGrid">
            <button class="emotion-btn btn-happy" data-emotion="happy">✨ 기쁘고 행복함</button>
            <button class="emotion-btn btn-sad" data-emotion="sad">🌧️ 슬프고 우울함</button>
            <button class="emotion-btn btn-burnout" data-emotion="burnout">🔋 지치고 번아웃</button>
            <button class="emotion-btn btn-stress" data-emotion="stress">🌪️ 불안·스트레스</button>
            <button class="emotion-btn btn-excitement" data-emotion="excitement">🚀 흥분·기대됨</button>
            <button class="emotion-btn btn-joy" data-emotion="joy">🎉 즐거움</button>
            <button class="emotion-btn btn-anger" data-emotion="anger" style="grid-column: span 2;">🔥 노여움·속상함</button>
        </div>

        <!-- 명언 출력 카드 -->
        <div class="card-view" id="cardView">
            <div class="quote-text" id="quoteText">명언 내용이 여기에 들어갑니다.</div>
            <div class="quote-author" id="quoteAuthor">- 발언자 -</div>
            <div class="action-btns">
                <button class="sub-btn btn-retry" id="retryBtn">🔄 다른 명언 보기</button>
                <button class="sub-btn btn-back" id="backBtn">🔙 감정 고르기</button>
            </div>
        </div>
    </div>

    <script>
        // 감정별 20개 이상의 명언 데이터 샘플 (실제 구현 시 각 카테고리별 20개씩 확장)
        const quotesData = {
            happy: [
                { quote: "행복은 향수와 같다. 자신에게 몇 방울 뿌리면 다른 사람들에게도 묻어난다.", author: "랄프 왈도 에머슨" },
                { quote: "가장 단순한 즐거움이 가장 큰 행복이다.", author: "톨스토이" },
                { quote: "미소는 마음의 문을 여는 가장 빠른 열쇠이다.", author: "작자 미상" },
                { quote: "기쁨을 나누면 배가 되고, 슬픔을 나누면 반이 된다.", author: "속담" }
            ],
            sad: [
                { quote: "눈물 속에는 마음을 씻어내는 신비로운 힘이 있다.", author: "오비디우스" },
                { quote: "가장 어두운 밤조차도 결국 끝나고 해는 떠오른다.", author: "빅토르 위고" },
                { quote: "슬픔을 견뎌내는 유일한 방법은 그 속을 통과해 걸어가는 것이다.", author: "로버트 프로스트" },
                { quote: "지금 흘리는 눈물은 더 단단해지기 위한 영양분이에요.", author: "마음 스위치" }
            ],
            burnout: [
                { quote: "잠시 멈춰 서서 숨을 고르는 것은 포기가 아니라 더 멀리 가기 위한 준비다.", author: "세네카" },
                { quote: "아무것도 하지 않는 시간조차도 너를 위한 소중한 휴식이야.", author: "마음 스위치" },
                { quote: "오늘 하루 버텨낸 것만으로도 너는 이미 대단한 일을 해냈어.", author: "작자 미상" },
                { quote: "달팽이처럼 느리게 가도 괜찮아. 방향만 맞다면 문제없어.", author: "생텍쥐페리" }
            ],
            stress: [
                { quote: "걱정의 90%는 실제로 일어나지 않는다. 그러니 오늘을 즐겨라.", author: "존 레논" },
                { quote: "마음이 흔들릴 때는 눈을 감고 깊게 세 번 숨을 쉬어보자.", author: "마음 스위치" },
                { quote: "산을 옮기는 사람은 작은 돌을 치우는 일부터 시작한다.", author: "공자" },
                { quote: "지금 겪는 이 고민도 1년 뒤에는 아주 사소한 기억이 될 거야.", author: "작자 미상" }
            ],
            excitement: [
                { quote: "가슴 뛰는 일에 네 전부를 걸어봐. 그 도전에 나이는 상관없어.", author: "월트 디즈니" },
                { quote: "새로운 시작은 언제나 두렵지만, 동시에 가장 설레는 기회야.", author: "마음 스위치" },
                { quote: "꿈을 이기려고 하지 말고, 꿈을 향해 달려가라.", author: "오프라 윈프리" },
                { quote: "네 안의 무한한 가능성을 믿어 의심치 마.", author: "세익스피어" }
            ],
            joy: [
                { quote: "웃음은 영혼의 조깅이다.", author: "토머스 카라일" },
                { quote: "오늘 이 순간의 즐거움을 온전히 누려보자!", author: "마음 스위치" },
                { quote: "유쾌한 마음은 건강과 장수의 가장 좋은 비결이다.", author: "호프랜드" },
                { quote: "즐거움은 전염된다. 주변을 밝게 비추어라.", author: "랄프 왈도 에머슨" }
            ],
            anger: [
                { quote: "화는 잠시 동안의 광기일 뿐이다. 스스로를 진정시켜라.", author: "호라티우스" },
                { quote: "누군가의 무례함 때문에 네 소중한 하루를 망치지 마.", author: "달라이 라마" },
                { quote: "숨을 깊게 들이쉬고 내쉬며, 마음속 분노를 바람에 날려보내자.", author: "마음 스위치" },
                { quote: "분노를 가라앉히는 가장 좋은 약은 시간과 침묵이다.", author: "아리스토텔레스" }
            ]
        };

        let currentEmotion = '';

        const emotionGrid = document.getElementById('emotionGrid');
        const cardView = document.getElementById('cardView');
        const quoteText = document.getElementById('quoteText');
        const quoteAuthor = document.getElementById('quoteAuthor');
        const retryBtn = document.getElementById('retryBtn');
        const backBtn = document.getElementById('backBtn');

        // 감정 버튼 클릭 이벤트
        document.querySelectorAll('.emotion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentEmotion = btn.getAttribute('data-emotion');
                showRandomQuote(currentEmotion);
                emotionGrid.style.display = 'none';
                cardView.style.display = 'block';
            });
        });

        // 무작위 명언 출력 함수
        function showRandomQuote(emotion) {
            const list = quotesData[emotion];
            const randomIndex = Math.floor(Math.random() * list.length);
            const selected = list[randomIndex];

            quoteText.textContent = `"${selected.quote}"`;
            quoteAuthor.textContent = `- ${selected.author} -`;
        }

        // 다른 명언 보기 버튼
        retryBtn.addEventListener('click', () => {
            showRandomQuote(currentEmotion);
        });

        // 돌아가기 버튼
        backBtn.addEventListener('click', () => {
            cardView.style.display = 'none';
            emotionGrid.style.display = 'grid';
        });
    </script>
</body>
</html>
