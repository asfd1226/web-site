<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물 짝맞추기 카드 뒤집기 게임</title>
    <!-- 폭죽 효과를 위한 Canvas Confetti 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Jua', 'Malgun Gothic', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74b9ff, #dfe6e9);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: #f1f2f6;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #2f3542;
        }

        .score-board span {
            font-weight: bold;
            color: #ff4757;
        }

        /* 카드 그리드 및 3D Flip 애니메이션 설정 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            aspect-ratio: 3 / 4;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            user-select: none;
        }

        .card-front {
            background-color: #ff7675;
            color: white;
            font-size: 1.8rem;
            border: 3px solid #d63031;
        }

        .card-back {
            background-color: #fff;
            transform: rotateY(180deg);
            border: 3px solid #74b9ff;
        }

        .btn-restart {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-restart:hover {
            background-color: #26af5f;
            transform: scale(1.05);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        /* 완료 안내 메시지 */
        .message-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            color: #2ed573;
            margin-bottom: 15px;
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🐾 동물 카드 뒤집기</h1>
        
        <div class="score-board">
            <div>점수: <span id="score">0</span>점</div>
            <div>시도 횟수: <span id="tries">0</span>회</div>
        </div>

        <div class="card-grid" id="cardGrid"></div>

        <button class="btn-restart" onclick="startGame()">다시 시작</button>
    </div>

    <!-- 완료 팝업 -->
    <div class="message-modal" id="clearModal">
        <div class="modal-content">
            <h2>🎉 정답 완성!</h2>
            <p>모든 동물 친구들을 찾았어요!</p>
            <br>
            <button class="btn-restart" onclick="startGame()">한 번 더 하기</button>
        </div>
    </div>

    <!-- 효과음 오디오 (Web Audio API 활용 합성음) -->
    <script>
        // 간단한 효과음 생성을 위한 AudioContext 유틸리티
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'flip') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // 도
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // 미
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // 솔
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'mismatch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                let notes = [523.25, 587.33, 659.25, 698.46, 783.99];
                notes.forEach((note, index) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(note, audioCtx.currentTime + index * 0.1);
                    g.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.1);
                    g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.2);
                    o.start(audioCtx.currentTime + index * 0.1);
                    o.stop(audioCtx.currentTime + index * 0.1 + 0.2);
                });
            }
        }

        // 게임 로직 구현
        const animals = ['🐶', '🐱', '🐰', '🐼', '🦁', '🐵', '🐸', '🦄'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let score = 0;
        let tries = 0;
        let isProcessing = false;

        function startGame() {
            document.getElementById('clearModal').style.display = 'none';
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            
            flippedCards = [];
            matchedPairs = 0;
            score = 0;
            tries = 0;
            isProcessing = false;
            updateScoreBoard();

            // 8개 동물 쌍을 골라 16장 카드 구성
            let selectedAnimals = [...animals];
            cards = [...selectedAnimals, ...selectedAnimals];
            // 카드 섞기
            cards.sort(() => Math.random() - 0.5);

            cards.forEach((animal, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.animal = animal;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">❓</div>
                        <div class="card-back">${animal}</div>
                    </div>
                `;

                card.addEventListener('click', () => flipCard(card));
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isProcessing) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound('flip');
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                tries++;
                updateScoreBoard();
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.animal === card2.dataset.animal) {
                // 일치하는 경우
                playSound('match');
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                score += 10;
                flippedCards = [];
                isProcessing = false;
                updateScoreBoard();

                // 모든 짝을 맞춘 경우 (총 8쌍)
                if (matchedPairs === animals.length) {
                    setTimeout(() => {
                        playSound('win');
                        document.getElementById('clearModal').style.display = 'flex';
                        // 폭죽 파티클 실행
                        confetti({
                            particleCount: 150,
                            spread: 80,
                            origin: { y: 0.6 }
                        });
                    }, 400);
                }
            } else {
                // 불일치하는 경우 (1초 뒤 재뒤집기)
                playSound('mismatch');
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isProcessing = false;
                }, 1000);
            }
        }

        function updateScoreBoard() {
            document.getElementById('score').innerText = score;
            document.getElementById('tries').innerText = tries;
        }

        // 초기 게임 실행
        startGame();
    </script>
</body>
</html>
