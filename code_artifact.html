<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>디지털 도장 & 서명 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Nanum+Myeongjo:wght@700&family=Black+Han+Sans&display=swap" rel="stylesheet">
    <style>
        .font-batang { font-family: 'Gowun Batang', serif; }
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif; }
        .font-sans-bold { font-family: 'Black Han Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
        
        <!-- 컨트롤 패널 -->
        <div class="p-8 space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">✨ 디지털 도장 & 서명 메이커</h2>
            
            <!-- 모드 선택 -->
            <div class="flex space-x-2 bg-slate-100 p-1 rounded-lg">
                <button onclick="setMode('stamp')" id="btn-stamp" class="flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-red-600 transition">전통 도장</button>
                <button onclick="setMode('sticker')" id="btn-sticker" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-600 transition">우리반 스티커</button>
                <button onclick="setMode('sign')" id="btn-sign" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-600 transition">커스텀 사인</button>
            </div>

            <!-- 도장 입력 필드 -->
            <div id="input-section" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">도장 문구 (예: 홍길동인)</label>
                    <input type="text" id="stamp-text" value="김교사인" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" oninput="draw()">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">글씨체 선택</label>
                    <select id="font-family" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" onchange="draw()">
                        <option value="Nanum Myeongjo">나눔명조 (공문서 추천)</option>
                        <option value="Gowun Batang">고운바탕 (부드러운 서체)</option>
                        <option value="Black Han Sans">블랙한산스 (고딕/강렬함)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">테두리 모양</label>
                    <select id="border-shape" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" onchange="draw()">
                        <option value="square">사각형 테두리</option>
                        <option value="circle">원형 테두리</option>
                        <option value="none">테두리 없음</option>
                    </select>
                </div>
            </div>

            <!-- 사인 패널 (사인 모드일 때만 표시) -->
            <div id="sign-section" class="hidden space-y-2">
                <label class="block text-sm font-medium text-slate-700">마우스로 서명을 그려주세요</label>
                <canvas id="sign-canvas" width="300" height="150" class="border rounded-lg bg-slate-50 cursor-crosshair w-full"></canvas>
                <button onclick="clearSign()" class="text-xs text-red-500 hover:underline">서명 지우기</button>
            </div>

            <button onclick="downloadPNG()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                투명 배경 PNG 다운로드 📥
            </button>
        </div>

        <!-- 미리보기 패널 -->
        <div class="bg-slate-900 flex flex-col items-center justify-center p-8 relative">
            <span class="absolute top-4 left-4 text-xs text-slate-400">실시간 투명 배경 미리보기</span>
            <div class="bg-[linear-gradient(45deg,#1e293b_25%,transparent_25%),linear-gradient(-45deg,#1e293b_25%,transparent_25%),linear-gradient(45deg,transparent_75%,#1e293b_75%),linear-gradient(-45deg,transparent_75%,#1e293b_75%)] bg-[size:20px_20px] bg-[position:0_0,0_10px,10px_-10px,-10px_0px] p-8 rounded-2xl shadow-inner flex items-center justify-center w-64 h-64">
                <canvas id="preview-canvas" width="200" height="200"></canvas>
            </div>
            <p class="text-xs text-slate-400 mt-4 text-center">격자무늬는 투명한 영역을 의미합니다.<br>공문서나 한글(HWP), Word에 바로 삽입하세요.</p>
        </div>

    </div>

    <script>
        let currentMode = 'stamp';
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');

        // 서명용 캔버스 세팅
        const signCanvas = document.getElementById('sign-canvas');
        const signCtx = signCanvas.getContext('2d');
        let isDrawing = false;

        signCanvas.addEventListener('mousedown', () => isDrawing = true);
        signCanvas.addEventListener('mouseup', () => { isDrawing = false; signCtx.beginPath(); draw(); });
        signCanvas.addEventListener('mousemove', drawSign);

        function drawSign(e) {
            if (!isDrawing) return;
            const rect = signCanvas.getBoundingClientRect();
            signCtx.lineWidth = 4;
            signCtx.lineCap = 'round';
            signCtx.strokeStyle = '#dc2626';
            signCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            signCtx.stroke();
            signCtx.beginPath();
            signCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            draw();
        }

        function clearSign() {
            signCtx.clearRect(0, 0, signCanvas.width, signCanvas.height);
            draw();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.flex.space-x-2 button').forEach(b => {
                b.classList.remove('bg-white', 'shadow', 'text-red-600');
                b.classList.add('text-slate-600');
            });
            document.getElementById(`btn-${mode}`).classList.add('bg-white', 'shadow', 'text-red-600');
            
            if(mode === 'sign') {
                document.getElementById('input-section').classList.add('hidden');
                document.getElementById('sign-section').classList.remove('hidden');
            } else {
                document.getElementById('input-section').classList.remove('hidden');
                document.getElementById('sign-section').classList.add('hidden');
                if(mode === 'sticker') {
                    document.getElementById('stamp-text').value = '우리반 칭찬해요!';
                    document.getElementById('border-shape').value = 'circle';
                } else {
                    document.getElementById('stamp-text').value = '김교사인';
                    document.getElementById('border-shape').value = 'square';
                }
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#dc2626';
            ctx.fillStyle = '#dc2626';

            if (currentMode === 'sign') {
                // 서명 이미지를 메인 캔버스로 복사
                ctx.drawImage(signCanvas, 10, 25, 180, 100);
                return;
            }

            const text = document.getElementById('stamp-text').value;
            const fontFamily = document.getElementById('font-family').value;
            const shape = document.getElementById('border-shape').value;

            ctx.save();
            // 테두리 그리기
            if (shape === 'square') {
                ctx.lineWidth = 6;
                ctx.strokeRect(15, 15, 170, 170);
            } else if (shape === 'circle') {
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(100, 100, 85, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 텍스트 렌더링
            ctx.font = `bold 36px "${fontFamily}"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (currentMode === 'sticker') {
                ctx.font = `bold 22px "${fontFamily}"`;
                ctx.fillText(text, 100, 100);
            } else {
                // 세로쓰기 느낌 혹은 정렬
                ctx.fillText(text, 100, 100);
            }
            ctx.restore();
        }

        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'digital-stamp.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 초기 실행
        window.onload = () => {
            setTimeout(draw, 100); // 폰트 로드 대기
        };
    </script>
</body>
</html>
