<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E9F8E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동기록">
<title>운동 기록 체크리스트</title>
<style>
:root{--bg:#EAF2F7;--surface:#FFF;--ink:#11283B;--muted:#5A7083;--line:#D3E0EA;--accent:#0E9F8E;--accent-ink:#FFF;--track:#D3E0EA;--danger:#C0392B;--chip:#DDEBF4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B26;--surface:#172636;--ink:#E6F0F7;--muted:#92A8BA;--line:#27394B;--accent:#34CDB9;--accent-ink:#06211D;--track:#27394B;--danger:#FF8A7A;--chip:#20344A}}
:root[data-theme="dark"]{--bg:#0F1B26;--surface:#172636;--ink:#E6F0F7;--muted:#92A8BA;--line:#27394B;--accent:#34CDB9;--accent-ink:#06211D;--track:#27394B;--danger:#FF8A7A;--chip:#20344A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;font-weight:900;margin:0 0 2px}
h2{font-size:1.1rem;margin:0}
.date{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.summary{display:flex;align-items:center;gap:20px;padding:20px}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .t{stroke:var(--track)}
.ring .p{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .5s ease}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:1.5rem;line-height:1.1}
.ring .n small{font-size:.75rem;font-weight:500;color:var(--muted)}
.msg{font-size:1.05rem;font-weight:700;margin:0 0 4px}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.add{display:flex;gap:8px;margin:18px 0 10px}
input,select{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
input[type=text]{flex:1}
button{font:inherit;cursor:pointer}
.btn{padding:11px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font-size:.85rem}
.chip[disabled]{opacity:.45;cursor:default}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px}
li.row label{flex:1;display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;min-width:0}
li.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
.name{overflow-wrap:anywhere}
li.done .name{text-decoration:line-through;color:var(--muted)}
li.done{border-color:var(--accent)}
.val{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.85rem}
.val input{width:70px;padding:7px 8px;text-align:right}
.del{border:0;background:transparent;color:var(--danger);padding:8px;border-radius:10px;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:26px 8px;border:1px dashed var(--line);border-radius:14px}
.hist{margin-top:28px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:10px}
.nav span{display:inline-block;min-width:110px;text-align:center;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:2px}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:var(--chip);color:var(--ink);font-size:.85rem;padding:0;position:relative}
.cal button.blank{background:none;pointer-events:none}
.cal button.today{font-weight:900;border-color:var(--ink)}
.cal button.sel{outline:3px solid var(--accent);outline-offset:1px}
.cal button i{position:absolute;inset:0;border-radius:9px;background:var(--accent);z-index:0}
.cal button b{position:relative;z-index:1;font-weight:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat strong{display:block;font-size:1.2rem}
.stat span{font-size:.75rem;color:var(--muted)}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{width:100%;min-width:300px;height:auto;display:block}
.chart-wrap rect{fill:var(--accent)}
.chart-wrap text{fill:var(--muted);font-size:9px}
.note{color:var(--muted);font-size:.8rem;margin-top:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem}
@media (max-width:380px){.summary{flex-direction:column;text-align:center}}
@media (prefers-reduced-motion:reduce){.ring .p{transition:none}}
</style>
</head>
<body>
<main>
  <h1>운동 기록 체크리스트</h1>
  <p class="date" id="date"></p>

  <section class="card summary" aria-live="polite">
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="t" cx="60" cy="60" r="52"/><circle class="p" id="ringp" cx="60" cy="60" r="52"/></svg>
      <div class="n"><span id="count">0/0</span><small id="pct">0%</small></div>
    </div>
    <div><p class="msg" id="msg"></p><p class="sub" id="sub"></p></div>
  </section>

  <div class="add">
    <input type="text" id="input" placeholder="운동 이름" maxlength="30" aria-label="운동 이름">
    <select id="unit" aria-label="단위"><option value="">단위 없음</option><option>km</option><option>개</option><option>분</option></select>
    <button class="btn" id="addBtn">추가</button>
  </div>
  <div class="chips" id="chips" aria-label="자주 하는 운동 선택"></div>
  <ul id="list"></ul>

  <section class="card hist" aria-label="월간 기록">
    <div class="bar">
      <h2>월간 기록</h2>
      <div class="nav"><button id="prev" aria-label="이전 달">‹</button><span id="mlabel"></span><button id="next" aria-label="다음 달">›</button></div>
    </div>
    <div class="cal" id="cal"></div>
    <p class="note">날짜를 누르면 그날의 기록을 보고 고칠 수 있어요. 진한 칸일수록 많이 달성한 날이에요.</p>
    <div class="bar" style="margin-top:18px"><h2>월간 누적 통계</h2><select id="pick" aria-label="통계 운동 선택"></select></div>
    <div class="stats">
      <div class="stat"><strong id="s1">0</strong><span id="l1">월 누적</span></div>
      <div class="stat"><strong id="s2">0일</strong><span>실천한 날</span></div>
      <div class="stat"><strong id="s3">0</strong><span id="l3">하루 평균</span></div>
    </div>
    <div class="chart-wrap" id="chart"></div>
  </section>
  <p class="note">기록은 이 기기의 이 브라우저에 저장돼요. 휴대폰과 PC는 기록이 따로 보관돼요. 휴대폰에서는 브라우저 메뉴의 “홈 화면에 추가”로 앱처럼 열 수 있어요.</p>
</main>

<script>
(function(){
  var KEY="exercise-log-v2",OLD="exercise-checklist-v1";
  var PRESETS=[["스트레칭",""],["걷기","km"],["달리기","km"],["푸시업","개"],["스쿼트","개"],["플랭크","분"],["요가","분"],["자전거","km"]];
  var S={items:[],rec:{}};
  var sel=ymd(new Date()),view=new Date(sel.slice(0,4),sel.slice(5,7)-1,1),pick="";
  var $=function(i){return document.getElementById(i)};

  function p2(n){return n<10?"0"+n:""+n}
  function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function load(){
    try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.items&&s.rec){S=s;return}}catch(e){}
    try{var o=JSON.parse(localStorage.getItem(OLD)||"null");
      if(o&&Array.isArray(o.items)){S.items=o.items.map(function(i){return{id:i.id,name:i.name,unit:""}})}}catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  function get(d,id){return (S.rec[d]&&S.rec[d][id])||{done:false,value:0}}
  function set(d,id,patch){
    S.rec[d]=S.rec[d]||{};var r=S.rec[d][id]||{done:false,value:0};
    for(var k in patch)r[k]=patch[k];S.rec[d][id]=r;save();render();
  }
  function addItem(name,unit){
    name=name.trim();if(!name||S.items.some(function(i){return i.name===name}))return;
    S.items.push({id:uid(),name:name,unit:unit||""});save();render();
  }
  function amount(d,it){var r=get(d,it.id);return it.unit?(r.value||0):(r.done?1:0)}
  function done(d,it){var r=get(d,it.id);return r.done||(it.unit&&r.value>0)}

  function render(){
    var t=new Date(sel+"T00:00:00");
    $("date").textContent=t.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"})+(sel===ymd(new Date())?" · 오늘":" · 지난 기록");
    var total=S.items.length,dn=S.items.filter(function(i){return get(sel,i.id).done}).length;
    $("count").textContent=dn+"/"+total;$("pct").textContent=(total?Math.round(dn/total*100):0)+"%";
    $("ringp").style.strokeDashoffset=326.7*(1-(total?dn/total:0));
    var m,s;
    if(!total){m="운동 항목을 추가해 보세요";s="직접 입력하거나 아래에서 골라 담아요."}
    else if(dn===total){m="모든 운동을 마쳤어요";s="수고했어요. 내일도 이어가 봐요."}
    else{m="남은 운동 "+(total-dn)+"개";s="완료 "+dn+"개 · 전체 "+total+"개"}
    $("msg").textContent=m;$("sub").textContent=s;

    var names=S.items.map(function(i){return i.name}),chips=$("chips");chips.innerHTML="";
    PRESETS.forEach(function(p){
      var b=document.createElement("button");b.className="chip";b.type="button";
      var has=names.indexOf(p[0])>-1;b.textContent=has?p[0]+" 담김":"+ "+p[0];b.disabled=has;
      b.onclick=function(){addItem(p[0],p[1])};chips.appendChild(b);
    });

    var ul=$("list");ul.innerHTML="";
    if(!total){var e=document.createElement("li");e.className="empty";e.textContent="아직 운동 항목이 없어요.";ul.appendChild(e)}
    S.items.forEach(function(it){
      var r=get(sel,it.id),li=document.createElement("li");li.className="row"+(r.done?" done":"");
      var lb=document.createElement("label"),cb=document.createElement("input");cb.type="checkbox";cb.checked=r.done;
      cb.onchange=function(){set(sel,it.id,{done:cb.checked})};
      var sp=document.createElement("span");sp.className="name";sp.textContent=it.name;
      lb.appendChild(cb);lb.appendChild(sp);li.appendChild(lb);
      if(it.unit){
        var v=document.createElement("div");v.className="val";
        var ip=document.createElement("input");ip.type="number";ip.min="0";ip.step=it.unit==="km"?"0.1":"1";ip.inputMode="decimal";
        ip.value=r.value||"";ip.setAttribute("aria-label",it.name+" 수치("+it.unit+")");
        ip.onchange=function(){var n=Math.max(0,parseFloat(ip.value)||0);set(sel,it.id,{value:n,done:n>0?true:get(sel,it.id).done})};
        v.appendChild(ip);v.appendChild(document.createTextNode(it.unit));li.appendChild(v);
      }
      var del=document.createElement("button");del.className="del";del.type="button";del.textContent="삭제";
      del.setAttribute("aria-label",it.name+" 삭제");
      del.onclick=function(){if(confirm("“"+it.name+"” 항목을 삭제할까요? 지난 기록도 함께 사라져요.")){
        S.items=S.items.filter(function(x){return x.id!==it.id});for(var d in S.rec)delete S.rec[d][it.id];save();render()}};
      li.appendChild(del);ul.appendChild(li);
    });
    renderMonth();
  }

  function renderMonth(){
    var y=view.getFullYear(),mo=view.getMonth(),days=new Date(y,mo+1,0).getDate(),first=new Date(y,mo,1).getDay();
    $("mlabel").textContent=y+"년 "+(mo+1)+"월";
    var cal=$("cal");cal.innerHTML="";
    "일월화수목금토".split("").forEach(function(c){var h=document.createElement("div");h.className="h";h.textContent=c;cal.appendChild(h)});
    for(var i=0;i<first;i++){var bl=document.createElement("button");bl.className="blank";bl.tabIndex=-1;cal.appendChild(bl)}
    var todayKey=ymd(new Date());
    for(var d=1;d<=days;d++){
      (function(d){
        var key=y+"-"+p2(mo+1)+"-"+p2(d),b=document.createElement("button");b.type="button";
        b.className=(key===todayKey?"today ":"")+(key===sel?"sel":"");
        var n=S.items.length,c=S.items.filter(function(it){return done(key,it)}).length;
        if(n&&c){var f=document.createElement("i");f.style.opacity=(0.25+0.75*c/n).toFixed(2);b.appendChild(f)}
        var tx=document.createElement("b");tx.textContent=d;b.appendChild(tx);
        b.setAttribute("aria-label",(mo+1)+"월 "+d+"일, "+c+"개 완료");
        b.onclick=function(){sel=key;render();window.scrollTo({top:0,behavior:"smooth"})};
        cal.appendChild(b);
      })(d);
    }
    var ps=$("pick"),cur=pick;ps.innerHTML="";
    S.items.forEach(function(it){var o=document.createElement("option");o.value=it.id;o.textContent=it.name;ps.appendChild(o)});
    if(!S.items.some(function(i){return i.id===cur}))cur=S.items.length?S.items[0].id:"";
    pick=cur;ps.value=cur;
    var it=S.items.filter(function(i){return i.id===cur})[0],ch=$("chart");
    if(!it){["s1","s3"].forEach(function(k){$(k).textContent="0"});$("s2").textContent="0일";ch.innerHTML="";return}
    var vals=[],sum=0,act=0;
    for(var k=1;k<=days;k++){var key=y+"-"+p2(mo+1)+"-"+p2(k),a=amount(key,it);vals.push(a);sum+=a;if(done(key,it))act++}
    var u=it.unit||"회",fmt=function(n){return Math.round(n*10)/10};
    $("s1").textContent=fmt(sum)+(it.unit?u:"회");$("l1").textContent="월 누적";
    $("s2").textContent=act+"일";
    $("s3").textContent=act?fmt(sum/act)+(it.unit?u:"회"):"0";$("l3").textContent=it.unit?"실천한 날 평균":"실천 비율 "+Math.round(act/days*100)+"%";
    var W=320,H=150,pad=18,mx=Math.max.apply(null,vals)||1,bw=(W-pad)/days,svg='<svg viewBox="0 0 '+W+' '+(H+18)+'" role="img" aria-label="'+it.name+' 일별 기록 막대그래프">';
    svg+='<line x1="'+pad+'" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="currentColor" opacity=".2"/>';
    svg+='<text x="0" y="12">'+fmt(mx)+'</text><text x="0" y="'+(H-2)+'">0</text>';
    vals.forEach(function(v,i){
      var h=v/mx*(H-20),x=pad+i*bw+1;
      if(v>0)svg+='<rect x="'+x.toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+Math.max(bw-2,1).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"><title>'+(i+1)+'일: '+fmt(v)+u+'</title></rect>';
      if((i+1)%5===0||i===0)svg+='<text x="'+(x+bw/2-3).toFixed(1)+'" y="'+(H+13)+'">'+(i+1)+'</text>';
    });
    ch.innerHTML=svg+"</svg>";
  }

  $("addBtn").onclick=function(){addItem($("input").value,$("unit").value);$("input").value="";$("input").focus()};
  $("input").addEventListener("keydown",function(e){if(e.key==="Enter")$("addBtn").click()});
  $("prev").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderMonth()};
  $("next").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderMonth()};
  $("pick").onchange=function(){pick=$("pick").value;renderMonth()};

  // PWA: 저장소 영구 보존 + 서비스워커 등록
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}

  load();save();render();
})();
</script>
</body>
</html>
